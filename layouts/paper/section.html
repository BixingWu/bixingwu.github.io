{{ define "main" }}
<main id="main" class="reader-width papers-index" tabindex="-1">
  <h1>Papers</h1>
  {{ range partialCached "publications.html" site.Home }}
    {{ $paper := . }}
    {{ with $paper.page }}
    <article class="index-paper">
      <a class="index-figure" href="{{ .RelPermalink }}" aria-label="Read {{ $paper.short_name }}">
        {{ with $paper.image }}{{ $preview := .Resize "640x webp q88" }}<img src="{{ $preview.RelPermalink }}" width="{{ $preview.Width }}" height="{{ $preview.Height }}" alt="{{ $paper.figure_alt }}">{{ end }}
      </a>
      <div>
        <p class="paper-eyebrow">{{ $paper.venue }}</p>
        <h2><a href="{{ .RelPermalink }}">{{ $paper.title }}</a></h2>
        <p>{{ .Description }}</p>
      </div>
    </article>
    {{ end }}
  {{ end }}
</main>
{{ end }}
