<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Shared slides · Bixing Wu</title>
  <link rel="icon" href="{{ "assets/icon.png" | relURL }}" type="image/png">
  {{ with resources.Get "assets/slides-gate.css" | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
  {{ if .IsPage }}{{ with resources.Get "assets/slides-gate.js" | fingerprint }}<script src="{{ .RelPermalink }}" defer></script>{{ end }}{{ end }}
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
