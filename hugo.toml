baseURL = "https://bixingwu.com/"
defaultContentLanguage = "en"
title = "Bixing Wu"
disableKinds = ["taxonomy", "term", "RSS", "404"]

[[module.mounts]]
source = "assets"
target = "static/assets"
files = ["! fonts/**", "! papers/**", "! paper-reader.css", "! paper-content.css", "! paper-reader.js", "! slides-gate.css", "! slides-gate.js", "! meeting-directory.css"]

[[module.mounts]]
source = "assets"
target = "assets/assets"

[[module.mounts]]
source = "style.css"
target = "assets/style.css"

[[module.mounts]]
source = "site.js"
target = "assets/site.js"

[[module.mounts]]
source = "CNAME"
target = "static/CNAME"

[[module.mounts]]
source = ".nojekyll"
target = "static/.nojekyll"
